<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Joy</title>
  <style>body { font: 20px sans-serif; padding: 20px } button { font-size: 20px; margin: 0 8px }</style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { mount } from './runtime.js';

    // Exposed globally so you can poke at it from the console, e.g. the ports
    // example: app.sendPort("excitement", "")
    window.app = await mount({
      wasm: './app.wasm',
      root: document.getElementById('app'),
      // The string your app's `init` receives. The "flags" example wants JSON
      // here, e.g. `{"name": "Brödil", "karma": 99}`
      flags: '',
    });
  </script>
</body>
</html>
