name: Test latest Joy release on latest Roc

# Every morning, test the latest published Joy bundle, by its real URL, on
# the newest numbered Roc release and on the newest Roc nightly. Green on the
# release makes it the one the guide recommends. Red means we adapt to Roc or
# report a bug.
#
# Speed runs on every system and in every browser, dev and size beside it.
# Publishing does not trigger this. The release workflow already tested that
# bundle as a draft.

on:
  schedule:
    # Nightlies publish between 10:00 and 13:30 UTC.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-roc
  cancel-in-progress: false

jobs:
  # Resolve the versions once, so every test leg runs the exact same Roc
  # against the exact same Joy release.
  resolve:
    name: Resolve the latest Roc and the latest Joy release
    runs-on: ubuntu-24.04
    outputs:
      nightly: ${{ steps.versions.outputs.nightly }}
      release: ${{ steps.versions.outputs.release }}
      release_version: ${{ steps.versions.outputs.release_version }}
      sha: ${{ steps.versions.outputs.sha }}
      prev_sha: ${{ steps.versions.outputs.prev_sha }}
      joy: ${{ steps.versions.outputs.joy }}
      bundle: ${{ steps.versions.outputs.bundle }}
    steps:
      - name: Resolve versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag=$(gh release view --repo roc-lang/nightlies --json tagName -q .tagName)
          # Tag spellings have changed before, but both end in the short sha
          prev=$(gh release list --repo roc-lang/nightlies --limit 2 --json tagName -q '.[1].tagName')

          # The newest published numbered release, such as 0.1.0_RC1, which the
          # guide spells 0.1.0-rc1. The 0.0.0 alphas came before Roc numbered
          # its releases.
          release=$(gh release list --repo roc-lang/roc --exclude-drafts --limit 50 --json tagName -q '.[].tagName' \
                      | grep -E '^[0-9]+\.[0-9]+\.[0-9]+([-_][A-Za-z0-9]+)?$' | grep -v '^0\.0\.' | head -1 || true)
          release_version=$(echo "$release" | tr 'A-Z_' 'a-z-')

          joy_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          bundle=$(gh release view --repo "$GITHUB_REPOSITORY" --json assets \
                     -q '.assets[] | select(.label != "cli" and (.name | endswith(".tar.zst"))) | .url')

          [ -n "$tag" ] || { echo "error: could not resolve the latest roc nightly" >&2; exit 1; }
          [ -n "$bundle" ] || { echo "error: no platform bundle on Joy $joy_tag" >&2; exit 1; }

          {
            echo "nightly=$tag"
            echo "release=$release"
            echo "release_version=$release_version"
            echo "sha=${tag##*-}"
            echo "prev_sha=${prev##*-}"
            echo "joy=$joy_tag"
            echo "bundle=$bundle"
          } >> "$GITHUB_OUTPUT"

          echo "Roc ${release:-(no release)} and $tag against Joy $joy_tag"
          echo "Testing Joy **$joy_tag** against Roc **${release_version:-(no release yet)}** and **$tag**" >> "$GITHUB_STEP_SUMMARY"

  # Versions go in the job name: `run-name` cannot see `needs`.
  test:
    needs: resolve
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["${{ needs.resolve.outputs.nightly }}"]'
      label: Joy ${{ needs.resolve.outputs.joy }} on ${{ needs.resolve.outputs.nightly }}
      opts: '["speed"]'
      ref: ${{ needs.resolve.outputs.joy }}
      bundle-url: ${{ needs.resolve.outputs.bundle }}
      e2e: all

  test-opts:
    needs: resolve
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["${{ needs.resolve.outputs.nightly }}"]'
      label: Joy ${{ needs.resolve.outputs.joy }} on ${{ needs.resolve.outputs.nightly }}
      opts: '["dev", "size"]'
      ref: ${{ needs.resolve.outputs.joy }}
      bundle-url: ${{ needs.resolve.outputs.bundle }}
      e2e: all

  # The newest numbered Roc release, the one the guide recommends. Skipped
  # while roc-lang/roc has none published.
  test-release:
    needs: resolve
    if: needs.resolve.outputs.release != ''
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["${{ needs.resolve.outputs.release }}"]'
      label: Joy ${{ needs.resolve.outputs.joy }} on Roc ${{ needs.resolve.outputs.release_version }}
      opts: '["speed"]'
      ref: ${{ needs.resolve.outputs.joy }}
      bundle-url: ${{ needs.resolve.outputs.bundle }}
      e2e: all

  test-release-opts:
    needs: resolve
    if: needs.resolve.outputs.release != ''
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["${{ needs.resolve.outputs.release }}"]'
      label: Joy ${{ needs.resolve.outputs.joy }} on Roc ${{ needs.resolve.outputs.release_version }}
      opts: '["dev", "size"]'
      ref: ${{ needs.resolve.outputs.joy }}
      bundle-url: ${{ needs.resolve.outputs.bundle }}
      e2e: all

  # Green at speed on every system and in every browser: the guide recommends
  # this release. dev and size are deliberately not in `needs`.
  recommend-release:
    name: Recommend Roc ${{ needs.resolve.outputs.release_version }} in the guide
    needs: [resolve, test-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Name this release in guide/Doc.roc
        env:
          RELEASE: ${{ needs.resolve.outputs.release_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sed -i -E "s/^([[:space:]]*roc_release = )\"[^\"]*\"$/\1\"$RELEASE\"/" guide/Doc.roc
          grep -q "roc_release = \"$RELEASE\"" guide/Doc.roc || {
            echo "error: guide/Doc.roc has no roc_release to point at $RELEASE" >&2
            exit 1
          }
          if git diff --quiet; then
            echo "the guide already recommends Roc $RELEASE"
            exit 0
          fi

          git config user.name 'GitHub Actions'
          git config user.email ''
          git commit -am "Guide: Recommend Roc $RELEASE"
          # main may have moved since checkout, replay this one commit on top
          # rather than failing the push.
          git pull --rebase origin main
          git push

          # A push made with GITHUB_TOKEN starts no workflow, but a dispatch
          # does.
          gh workflow run deploy-docs.yml --ref main

  # Refresh versions.json every morning, whether or not the nightly passed,
  # for a release whose own events ran an older versions-index.yml (see
  # there).
  versions-index:
    permissions:
      contents: write
    uses: ./.github/workflows/versions-index.yml

  name-commit-range:
    name: Name the commit range
    needs: [resolve, test]
    # Only for a red suite. A failed `resolve` would leave every version
    # below empty.
    if: needs.test.result == 'failure'
    runs-on: ubuntu-24.04
    steps:
      - name: Name the commit range
        run: |
          echo "::error::Joy ${{ needs.resolve.outputs.joy }} fails on roc ${{ needs.resolve.outputs.nightly }}"
          echo "  https://github.com/roc-lang/roc/compare/${{ needs.resolve.outputs.prev_sha }}...${{ needs.resolve.outputs.sha }}"
