name: Main

# Every push to main. This is the only workflow that deliberately builds roc
# from source to warm the binary cache, then runs the same suite a PR runs.
# The other workflows expect cache hits (a cold cache still makes any of
# them build from source, the setup action warns when that happens). Slow
# right after the roc-src pin moves, then a cache hit until it moves again.

on:
  push:
    branches: [main]
  # Rebuild and re-push without waiting for a commit, e.g. after the cache
  # has been pruned.
  workflow_dispatch:

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    name: Build and cache the compiler (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-15' && vars.MAC_RUNNER || matrix.os }}
    strategy:
      # A cold cache on one system must not stop the other from being filled.
      fail-fast: false
      matrix:
        # One push per system, since Nix cannot cross-compile to Darwin.
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4

      # The self-hosted Mac has Nix and keeps its store, so warming fills
      # that store for the legs that run there next.
      - name: Use this machine's Nix
        if: runner.environment == 'self-hosted'
        run: .github/scripts/machine-nix.sh

      - if: runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            substituters = https://cache.nixos.org https://niclas-ahden.cachix.org
            trusted-substituters = https://cache.nixos.org https://niclas-ahden.cachix.org
            accept-flake-config = true
            extra-trusted-public-keys = niclas-ahden.cachix.org-1:FdGli1vBk0cTuVJV27Tau/JvlbW+Ly3pRwFByyqdke0=

      # The write token. It lives here instead of in tests.yml so that fork
      # PRs never need a secret.
      # cachix-action installs cachix into the user's profile, which on the
      # Mac is a real person's. The push below runs cachix from nixpkgs there.
      - if: runner.environment != 'self-hosted'
        uses: cachix/cachix-action@v15
        with:
          name: niclas-ahden
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # No --max-jobs 0 here: building on a miss is the point. cachix-action
      # pushes whatever this produces.
      - name: Build the pinned Roc compiler
        run: nix build .#roc --no-link --print-out-paths

      # Push the whole devShell closure too, or `nix develop` still compiles
      # playwright, rust and friends on a cold cache. A repository without
      # the write token (a fork, or the staging repository) only pulls.
      - name: Build and cache the devShell
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix develop --profile .cachix-profile --command true
          if [ -n "$CACHIX_AUTH_TOKEN" ] && [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            nix build .#roc --print-out-paths | nix run nixpkgs#cachix -- push niclas-ahden
            nix run nixpkgs#cachix -- push niclas-ahden .cachix-profile
          elif [ -n "$CACHIX_AUTH_TOKEN" ]; then
            cachix push niclas-ahden .cachix-profile
          else
            echo "No CACHIX_AUTH_TOKEN, so nothing is pushed."
          fi

  # The same legs a pull request had to pass, re-run on the merge result.
  required:
    needs: warm
    # Warming is an optimization. A failed push just means a slower suite.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/suite.yml
    with:
      mac-runner: ${{ vars.MAC_RUNNER || 'macos-15' }}
      roc: '["pinned"]'
      label: Pinned
      opts: '["speed"]'
      extras: true
      e2e: all

  # Informational, see tests.yml. A red leg here reddens the run but gates
  # nothing.
  advisory:
    needs: warm
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/suite.yml
    with:
      mac-runner: ${{ vars.MAC_RUNNER || 'macos-15' }}
      roc: '["pinned"]'
      label: Advisory
      opts: '["dev", "size"]'
      e2e: all

  # The Roc release the guide recommends, downloaded, as on a pull request
  # (see tests.yml): the no-Nix route, which is also the Windows one. Speed
  # blocks, the other opt levels inform.
  roc-release:
    name: Resolve the Roc release the guide recommends
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*roc_release = "\(.*\)"$/\1/p' guide/Doc.roc | head -1)
          [ -n "$version" ] || { echo "error: guide/Doc.roc has no roc_release" >&2; exit 1; }
          # roc-lang/roc tags 0.1.0-rc1 as 0.1.0_RC1.
          tag=$(gh release list --repo roc-lang/roc --exclude-drafts --limit 50 --json tagName -q '.[].tagName' \
                  | while read -r t; do [ "$(echo "$t" | tr 'A-Z_' 'a-z-')" != "$version" ] || echo "$t"; done | head -1)
          [ -n "$tag" ] || { echo "error: roc-lang/roc has no published release $version" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "the guide recommends Roc $version, tagged $tag"

  roc-release-speed:
    needs: roc-release
    uses: ./.github/workflows/suite.yml
    with:
      mac-runner: ${{ vars.MAC_RUNNER || 'macos-15' }}
      roc: '["${{ needs.roc-release.outputs.tag }}"]'
      label: Roc release
      opts: '["speed"]'
      e2e: all

  roc-release-opts:
    needs: roc-release
    uses: ./.github/workflows/suite.yml
    with:
      mac-runner: ${{ vars.MAC_RUNNER || 'macos-15' }}
      roc: '["${{ needs.roc-release.outputs.tag }}"]'
      label: Roc release
      opts: '["dev", "size"]'
      e2e: all
