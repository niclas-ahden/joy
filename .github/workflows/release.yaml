name: Release

# Tag-driven release flow:
#
#   git tag 0.33.0 && git push origin 0.33.0
#
# 1. `required` gates `draft`: pinned compiler, speed, both OS, extras.
# 2. `draft` bundles the platform and creates a DRAFT release with the bundle,
#    docs and starter notes attached. A human presses Publish.
# 3. `bundle` tests that exact bundle the way a consumer will: both compilers,
#    every opt level, both OS, real browser.
# 4. `recommend` names the newest nightly in the notes if it passed both from
#    scratch (`nightly`) and on the bundle.
#
# Everything else (`*-advisory`) runs dev/size and may be red without
# blocking anything. Publish only when the whole run is green.

on:
  push:
    tags:
      - '[0-9]*'
  # Re-run for an existing tag: pick the tag as the ref when dispatching.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: Require a tag
    runs-on: ubuntu-24.04
    steps:
      - run: |
          [[ "$GITHUB_REF" == refs/tags/* ]] || {
            echo "error: this workflow releases a tag, run it from one (push a tag, or pick it as the ref when dispatching)" >&2
            exit 1
          }

  # The release gate.
  required:
    needs: guard
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["pinned"]'
      label: Release gate
      opts: '["speed"]'
      extras: true

  # Informational, see tests.yml. A red leg here reddens the run but gates
  # nothing.
  advisory:
    needs: guard
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["pinned"]'
      label: Advisory
      opts: '["dev", "size"]'

  resolve-nightly:
    name: Resolve the latest Roc nightly
    needs: guard
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo roc-lang/nightlies --json tagName -q .tagName)
          [ -n "$tag" ] || { echo "error: could not resolve the latest roc nightly" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest nightly is $tag"

  # From-scratch build on the newest nightly, which is what a contributor
  # following the README does. It cannot stop the draft. It decides what
  # `recommend` may claim in the notes.
  nightly:
    needs: [guard, resolve-nightly]
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["${{ needs.resolve-nightly.outputs.tag }}"]'
      label: Latest nightly
      opts: '["speed"]'

  # Separate call so a known roc dev-mode bug cannot block `recommend`.
  nightly-advisory:
    needs: [guard, resolve-nightly]
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["${{ needs.resolve-nightly.outputs.tag }}"]'
      label: Latest nightly advisory
      opts: '["dev"]'

  draft:
    name: Bundle, verify and draft the release
    needs: required
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      archive: ${{ steps.bundle.outputs.archive }}
      artifact: bundle-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - id: setup
        uses: ./.github/actions/setup
        with:
          roc: pinned
          github-token: ${{ github.token }}

      - name: Bundle the platform
        id: bundle
        run: |
          ${{ steps.setup.outputs.prefix }} ./bundle.roc
          echo "archive=$(basename dist/*.tar.zst)" >> "$GITHUB_OUTPUT"

      # Seconds-long sanity check so an outright broken bundle is never
      # attached to a release. The full matrix (`bundle`) runs after drafting.
      - name: Verify the bundle end to end
        run: |
          set -euo pipefail
          mkdir -p verify
          cp dist/*.tar.zst verify/
          ${{ steps.setup.outputs.prefix }} bash -c 'cd verify && roc unbundle'
          extracted=$(find verify -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)
          sed "s|\"\.\./platform/main.roc\"|\"./$extracted/main.roc\"|" examples/hello.roc > verify/hello.roc
          # If the sed pattern didn't match, the copy still points at the
          # repo's own platform tree and the verification proves nothing.
          grep -q "\"./$extracted/main.roc\"" verify/hello.roc || {
            echo "error: platform path substitution failed in verify/hello.roc" >&2
            exit 1
          }
          ${{ steps.setup.outputs.prefix }} roc build --opt=speed --target=wasm32 --no-cache --output=build/speed/hello.wasm verify/hello.roc
          ${{ steps.setup.outputs.prefix }} env JOY_OPT=speed node tests/check_hello.mjs

      # For `bundle`. Draft assets need a token and roc fetches anonymously,
      # so the bundle travels as an artifact and each leg serves it to roc
      # over localhost.
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ github.run_id }}
          path: dist/*.tar.zst
          if-no-files-found: error
          retention-days: 7

      - name: Generate docs
        run: |
          ${{ steps.setup.outputs.prefix }} roc docs platform/main.roc --output=generated-docs
          tar -czf docs.tar.gz -C generated-docs .

      - name: Draft the release with assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          # Reuse an existing release on re-runs, otherwise draft a new one
          # with generated notes as the starting point for editing.
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --draft --title "$tag" --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi

          gh release upload "$tag" dist/*.tar.zst docs.tar.gz \
            --clobber --repo "$GITHUB_REPOSITORY"

          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/${{ steps.bundle.outputs.archive }}"
          html=$(grep -o 'https://[^"]*' platform/main.roc | head -1)
          [ -n "$html" ] || {
            echo "error: no joy-html URL in platform/main.roc" >&2
            exit 1
          }
          # Start from the nightly the README names, which is the last one
          # known to pass. The `recommend` job moves it forward if the newest
          # nightly passed too. If it did not, this is the right claim to keep.
          nightly=$(sed -n 's|.*/roc-lang/nightlies/releases/tag/\(nightly-[^)]*\)).*|\1|p' README.md | head -1)
          [ -n "$nightly" ] || {
            echo "error: no roc nightly link in README.md" >&2
            exit 1
          }

          # Append each section once, re-runs must not duplicate them.
          gh release view "$tag" --json body -q .body --repo "$GITHUB_REPOSITORY" > notes.md
          edited=

          if ! grep -q '## Roc compiler version' notes.md; then
            {
              echo ""
              echo "## Roc compiler version"
              echo ""
              echo "Compatible with: [\`roc $nightly\`](https://github.com/roc-lang/nightlies/releases/tag/$nightly)."
              echo ""
              echo "Roc is currently a moving target and which version you're using matters a lot. We test the latest Joy release against the latest Roc nightly and update the compatibility here every day."
              echo ""
              echo "Oftentimes you'll still be able to use Joy with other Roc versions than what's listed here, but if you run into any issues, please try the Roc version above."
            } >> notes.md
            edited=1
          fi

          if ! grep -q '## Using this release' notes.md; then
            {
              echo ""
              echo "## Using this release"
              echo ""
              echo '```roc'
              echo "app [Model, Msg, init, update, render, subscriptions] {"
              echo "    pf: platform \"$url\","
              echo "    html: \"$html\","
              echo "}"
              echo '```'
            } >> notes.md
            edited=1
          fi

          [ -z "$edited" ] || gh release edit "$tag" --notes-file notes.md --repo "$GITHUB_REPOSITORY"

          draft_url=$(gh release view "$tag" --json url -q .url --repo "$GITHUB_REPOSITORY")
          {
            echo "## Draft release ready"
            echo ""
            echo "Bundled, verified and attached: $draft_url"
            echo ""
            echo "Before editing the notes or pressing Publish, wait for the rest of this run:"
            echo "the *Drafted bundle* legs build every app against this bundle the way a"
            echo "consumer's compiler will, and *Name the newest passing nightly* may still"
            echo "rewrite the notes."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "draft ready: $draft_url"

  # The consumer's path. roc downloads, hash-checks and unbundles the drafted
  # bundle, then every app builds and runs against it. The pinned compiler is
  # the one that produced the bundle, so it catches packaging bugs. The
  # nightly is the one consumers install. Speed decides (`recommend` and
  # whether to publish). dev and size only inform.
  bundle:
    needs: [draft, resolve-nightly]
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["pinned", "${{ needs.resolve-nightly.outputs.tag }}"]'
      label: Drafted bundle
      opts: '["speed"]'
      e2e: all
      bundle-artifact: ${{ needs.draft.outputs.artifact }}

  bundle-advisory:
    needs: [draft, resolve-nightly]
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["pinned", "${{ needs.resolve-nightly.outputs.tag }}"]'
      label: Drafted bundle advisory
      opts: '["dev", "size"]'
      e2e: all
      bundle-artifact: ${{ needs.draft.outputs.artifact }}

  # The notes start on the README's nightly, the last known good. Move them
  # to the newest nightly only if it passed from scratch and on the bundle.
  # Plain `needs` skips this job otherwise. dev and size are deliberately
  # not in the list.
  recommend:
    name: Name the newest passing nightly in the notes
    needs: [resolve-nightly, nightly, bundle, draft]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/name-nightly.sh \
            "$GITHUB_REF_NAME" "${{ needs.resolve-nightly.outputs.tag }}"
