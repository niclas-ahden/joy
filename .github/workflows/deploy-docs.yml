name: Deploy docs to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'platform/**'
      - 'docs/**'
  # Re-deploy when a release is published. Its docs.tar.gz was attached while
  # the release was still a draft (see release.yaml), so it is already there
  # to serve.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - id: setup
        uses: ./.github/actions/setup
        with:
          roc: pinned
          github-token: ${{ github.token }}

      # Each release carries its docs as a docs.tar.gz asset (attached by the
      # Release workflow). Serve every release's docs under /<tag>/. The
      # generated pages only use relative URLs, so they can live at any
      # subpath unmodified. Drafts are filtered out: a pending draft must not
      # publish docs, let alone become the landing page redirect.
      - name: Fetch docs for each release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          latest=""
          for tag in $(gh release list --repo "${{ github.repository }}" --json tagName,isDraft -q '.[] | select(.isDraft | not) | .tagName'); do
            if gh release download "$tag" --repo "${{ github.repository }}" \
                 --pattern docs.tar.gz --output /tmp/docs.tar.gz --clobber 2>/dev/null; then
              mkdir -p "site/$tag"
              tar -xzf /tmp/docs.tar.gz -C "site/$tag"
              rm /tmp/docs.tar.gz
              [ -n "$latest" ] || latest="$tag"
              echo "added docs for $tag"
            else
              echo "no docs.tar.gz on $tag, skipping"
            fi
          done
          # gh lists newest releases first, so the first hit is the landing
          # page target. Fall back to the main-branch docs before any release
          # has published docs.
          echo "${latest:-main}" > /tmp/redirect-target

      - name: Build docs for the main branch
        run: ${{ steps.setup.outputs.prefix }} roc docs platform/main.roc --output=site/main

      - name: Add the landing page
        run: |
          redirect=$(cat /tmp/redirect-target)
          sed "s|LATESTVERSION|$redirect|g" docs/index.html > site/index.html
          echo "landing page redirects to $redirect"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
