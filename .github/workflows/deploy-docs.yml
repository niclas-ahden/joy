name: Deploy docs to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'platform/**'
      - 'guide/**'
  # Re-deploy when a release is published. Its docs.tar.gz was attached while
  # the release was still a draft (see release.yaml), so it is already there
  # to serve.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - id: setup
        uses: ./.github/actions/setup
        with:
          roc: pinned
          github-token: ${{ github.token }}

      # Each release carries its docs as a docs.tar.gz asset (attached by the
      # Release workflow). Serve every release's docs under /<tag>/. The
      # generated pages only use relative URLs, so they can live at any
      # subpath unmodified. Drafts are filtered out: a pending draft must not
      # publish docs, let alone become the landing page redirect.
      - name: Fetch docs for each release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          latest=""
          for tag in $(gh release list --repo "${{ github.repository }}" --json tagName,isDraft -q '.[] | select(.isDraft | not) | .tagName'); do
            if gh release download "$tag" --repo "${{ github.repository }}" \
                 --pattern docs.tar.gz --output /tmp/docs.tar.gz --clobber 2>/dev/null; then
              mkdir -p "site/$tag"
              tar -xzf /tmp/docs.tar.gz -C "site/$tag"
              rm /tmp/docs.tar.gz
              [ -n "$latest" ] || latest="$tag"
              echo "added docs for $tag"
            else
              echo "no docs.tar.gz on $tag, skipping"
            fi
          done
          # gh lists newest releases first, so the first hit is the release
          # the guide links to. Fall back to the main-branch docs before
          # any release has published docs.
          echo "${latest:-main}" > /tmp/latest-docs

      - name: Build docs for the main branch
        run: ${{ steps.setup.outputs.prefix }} roc docs platform/main.roc --output=site/main

      # The guide's topics are Roc modules, rendered into its page.
      - name: Build the guide
        run: ${{ steps.setup.outputs.prefix }} bash -c 'cd guide && roc ./build.roc'

      # The guide is the landing page, and links to the API docs. Its samples
      # name the platform as VERSION/HASH, which becomes the platform bundle
      # of the same release, so a sample that is copied builds. A release
      # labels that asset "platform". Older ones have one bundle and no
      # label. With no release to name, the samples stay as they are written.
      - name: Add the guide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(cat /tmp/latest-docs)
          cp guide/www/style.css site/
          platform=""
          if [ "$latest" != "main" ]; then
            assets=$(gh release view "$latest" --repo "${{ github.repository }}" --json assets \
              -q '.assets[] | select(.name | endswith(".tar.zst")) | "\(.label) \(.url)"' 2>/dev/null || true)
            platform=$(printf '%s\n' "$assets" | sed -n 's|^platform ||p' | head -1)
            [ -n "$platform" ] || platform=$(printf '%s\n' "$assets" | sed -n 's|^ ||p' | head -1)
          fi
          placeholder="https://github.com/niclas-ahden/joy/releases/download/VERSION/HASH.tar.zst"
          if [ -n "$platform" ]; then
            sed -e "s|LATESTVERSION|$latest|g" -e "s|$placeholder|$platform|g" guide/www/index.html > site/index.html
            echo "the guide's samples name $platform"
          else
            sed "s|LATESTVERSION|$latest|g" guide/www/index.html > site/index.html
            echo "no platform bundle to name, the guide's samples keep VERSION/HASH"
          fi
          echo "the guide links to the docs for $latest"

      # The guide's editors compile the reader's code in the page, with a
      # compiler built outside this repository against one release's platform.
      # It is attached to that release as docs-editor.tar.gz and unpacked
      # beside the guide. Without it the guide's examples are plain code
      # blocks, which is how the page reads when its script is missing.
      - name: Add the guide's editors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(cat /tmp/latest-docs)
          if [ "$latest" != "main" ] && gh release download "$latest" --repo "${{ github.repository }}" \
               --pattern docs-editor.tar.gz --output /tmp/docs-editor.tar.gz --clobber 2>/dev/null; then
            mkdir -p site/editor
            tar -xzf /tmp/docs-editor.tar.gz -C site/editor
            rm /tmp/docs-editor.tar.gz
            cp guide/www/editor.js site/
            echo "added the editors of $latest"
          else
            echo "::warning::no docs-editor.tar.gz on $latest, so the guide's examples cannot be edited"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
