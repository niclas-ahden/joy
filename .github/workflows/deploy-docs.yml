name: Deploy docs to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'platform/**'
      - 'docs/**'
  # Re-deploy after a release publishes its docs.tar.gz asset.
  workflow_run:
    workflows: ["Bundle Platform"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          # Signature checking stays on for the public caches. Only
          # magic-nix-cache-action's local server is trusted unsigned
          # (?trusted=1) because it merely replays this repo's own CI builds.
          extra_nix_config: |
            substituters = https://cache.nixos.org https://niclas-ahden.cachix.org http://127.0.0.1:37515?trusted=1
            trusted-substituters = https://cache.nixos.org https://niclas-ahden.cachix.org http://127.0.0.1:37515?trusted=1
            accept-flake-config = true
            extra-trusted-public-keys = niclas-ahden.cachix.org-1:FdGli1vBk0cTuVJV27Tau/JvlbW+Ly3pRwFByyqdke0=

      - uses: DeterminateSystems/magic-nix-cache-action@v13

      # --max-jobs 0 forbids local builds, so a compiler that is missing from
      # the binary cache shows up here as a warning naming the fix, instead of
      # as half an hour of silent compiling inside the next step.
      - name: Substitute the Roc compiler
        run: |
          nix build .#roc --no-link --max-jobs 0 \
            || echo "::warning::The pinned Roc compiler is not in the binary cache, so this run builds it from source. Run ./cache.roc to push it."

      - name: Fetch Nix dependencies
        run: nix develop --command true

      # Each release carries its docs as a docs.tar.gz asset (uploaded by the
      # Bundle Platform workflow). Serve every release's docs under /<tag>/.
      # The generated pages only use relative URLs, so they can live at any
      # subpath unmodified.
      - name: Fetch docs for each release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          latest=""
          for tag in $(gh release list --repo "${{ github.repository }}" --json tagName -q '.[].tagName'); do
            if gh release download "$tag" --repo "${{ github.repository }}" \
                 --pattern docs.tar.gz --output /tmp/docs.tar.gz --clobber 2>/dev/null; then
              mkdir -p "site/$tag"
              tar -xzf /tmp/docs.tar.gz -C "site/$tag"
              rm /tmp/docs.tar.gz
              [ -n "$latest" ] || latest="$tag"
              echo "added docs for $tag"
            else
              echo "no docs.tar.gz on $tag, skipping"
            fi
          done
          # gh lists newest releases first, so the first hit is the landing
          # page target. Fall back to the main-branch docs before any release
          # has published docs.
          echo "${latest:-main}" > /tmp/redirect-target

      - name: Build docs for the main branch
        run: nix develop -c roc docs platform/main.roc --output=site/main

      - name: Add the landing page
        run: |
          redirect=$(cat /tmp/redirect-target)
          sed "s|LATESTVERSION|$redirect|g" docs/index.html > site/index.html
          echo "landing page redirects to $redirect"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
