name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on the flake pinned Roc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          # Signature checking stays on for the public caches. Only
          # magic-nix-cache-action's local server is trusted unsigned
          # (?trusted=1) because it merely replays this repo's own CI builds.
          extra_nix_config: |
            substituters = https://cache.nixos.org https://niclas-ahden.cachix.org http://127.0.0.1:37515?trusted=1
            trusted-substituters = https://cache.nixos.org https://niclas-ahden.cachix.org http://127.0.0.1:37515?trusted=1
            accept-flake-config = true
            extra-trusted-public-keys = niclas-ahden.cachix.org-1:FdGli1vBk0cTuVJV27Tau/JvlbW+Ly3pRwFByyqdke0=

      - uses: DeterminateSystems/magic-nix-cache-action@v13

      # --max-jobs 0 forbids local builds, so a compiler that is missing from
      # the binary cache shows up here as a warning naming the fix, instead of
      # as half an hour of silent compiling inside the next step.
      - name: Substitute the Roc compiler
        run: |
          nix build .#roc --no-link --max-jobs 0 \
            || echo "::warning::The pinned Roc compiler is not in the binary cache, so this run builds it from source. Run ./cache.roc to push it."

      - name: Fetch Nix dependencies
        run: nix develop --command true

      # tests.roc builds via build.roc (host object + every example) and runs
      # the node harnesses.
      - name: Build host + examples and run checks
        run: nix develop -c ./tests.roc

      # Second pass with tiny initial outbound buffers so every render
      # exercises the buffer growth path.
      - name: Re-run checks with small buffers
        run: nix develop -c env SMALL_BUFFERS=1 ./tests.roc

      # Browser E2E: the tests/e2e/ suite drives the built examples in a real
      # Chromium (the devShell carries playwright and its browsers). The build
      # is a no-op here, tests.roc already did it.
      - name: Run browser E2E tests
        run: nix develop -c ./e2e.roc

  # The job above uses the Roc version from flake.nix. The following job runs
  # the same against the nightly Roc version which our README recommends.
  nightly:
    name: Test on the Roc nightly named in the README
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the nightly named in the README
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag=$(sed -n 's|.*/roc-lang/nightlies/releases/tag/\(nightly-[^)]*\)).*|\1|p' README.md | head -1)
          [ -n "$tag" ] || { echo "error: no roc nightly link in README.md" >&2; exit 1; }

          url=$(gh release view "$tag" --repo roc-lang/nightlies --json assets \
                  -q '.assets[] | select(.name | test("linux_x86_64")) | .url')
          [ -n "$url" ] || { echo "error: no linux_x86_64 asset on $tag" >&2; exit 1; }

          {
            echo "tag=$tag"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"

          echo "README names $tag"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.0'
          targets: wasm32-unknown-unknown

      - name: Install the Roc nightly
        run: |
          set -euo pipefail
          curl -sSL -o roc_nightly.tar.gz "${{ steps.nightly.outputs.url }}"
          mkdir -p "$RUNNER_TEMP/roc"
          tar -xzf roc_nightly.tar.gz --strip-components=1 -C "$RUNNER_TEMP/roc"
          echo "$RUNNER_TEMP/roc" >> "$GITHUB_PATH"

      - run: roc --version

      - name: Build host + examples and run checks
        run: ./tests.roc

      - name: Name the nightly
        if: failure()
        run: |
          echo "::error::This branch fails on ${{ steps.nightly.outputs.tag }}, the nightly the README tells users to install"
