name: Tests

# Pull request checks. Everything here only reads the binary cache. The
# compiler is substituted with --max-jobs 0, so a cache miss is a warning
# instead of half an hour of silent compiling on someone's PR.
#
# main.yml fills that cache on every push to main. So the first PR after the
# roc-src pin moves may be slow, and every one after main has caught up is
# fast.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What a PR has to pass. Speed on every system, plus the small-buffers leg
  # and the browser E2E suite in every engine on every system.
  required:
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["pinned"]'
      label: Pinned
      opts: '["speed"]'
      extras: true
      e2e: all

  # Informational and not branch-protected. dev is red on open roc bugs.
  # Running it anyway means we see the day it goes green.
  advisory:
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["pinned"]'
      label: Advisory
      opts: '["dev", "size"]'
      e2e: all

  # Users install a downloaded Roc, not the one flake.nix builds. These legs
  # run the release the guide recommends that way.
  roc-release:
    name: Resolve the Roc release the guide recommends
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*roc_release = "\(.*\)"$/\1/p' guide/Doc.roc | head -1)
          [ -n "$version" ] || { echo "error: guide/Doc.roc has no roc_release" >&2; exit 1; }
          # roc-lang/roc tags 0.1.0-rc1 as 0.1.0_RC1.
          tag=$(gh release list --repo roc-lang/roc --exclude-drafts --limit 50 --json tagName -q '.[].tagName' \
                  | while read -r t; do [ "$(echo "$t" | tr 'A-Z_' 'a-z-')" != "$version" ] || echo "$t"; done | head -1)
          [ -n "$tag" ] || { echo "error: roc-lang/roc has no published release $version" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "the guide recommends Roc $version, tagged $tag"

  # Blocking on purpose: red means Joy fails on the Roc users install.
  roc-release-speed:
    needs: roc-release
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["${{ needs.roc-release.outputs.tag }}"]'
      label: Roc release
      opts: '["speed"]'
      e2e: all

  # The other opt levels on that same release, on every system and in every
  # browser. Informational like `advisory`: dev is red on open roc bugs, and
  # a known-red leg must not block a pull request.
  roc-release-opts:
    needs: roc-release
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["${{ needs.roc-release.outputs.tag }}"]'
      label: Roc release
      opts: '["dev", "size"]'
      e2e: all
