name: Tests

# Pull request checks. Everything here only reads the binary cache. The
# compiler is substituted with --max-jobs 0, so a cache miss is a warning
# instead of half an hour of silent compiling on someone's PR.
#
# main.yml fills that cache on every push to main. So the first PR after the
# roc-src pin moves may be slow, and every one after main has caught up is
# fast.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What a PR has to pass. Speed on every system, plus the small-buffers leg
  # and the browser E2E suite on linux.
  required:
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["pinned"]'
      label: Pinned
      opts: '["speed"]'
      extras: true
      e2e: linux

  # Informational and not branch-protected. dev is red on open roc bugs.
  # Running it anyway means we see the day it goes green.
  advisory:
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["pinned"]'
      label: Advisory
      opts: '["dev", "size"]'

  # The compiler in flake.nix is not the one the README tells people without
  # Nix to install. This leg is the one that says the README's instructions
  # still work.
  readme-nightly:
    name: Resolve the nightly named in the README
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.readme.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: readme
        run: |
          set -euo pipefail
          tag=$(sed -n 's|.*/roc-lang/nightlies/releases/tag/\(nightly-[^)]*\)).*|\1|p' README.md | head -1)
          [ -n "$tag" ] || { echo "error: no roc nightly link in README.md" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "README names $tag"

  # Blocking on purpose: red means the README's instructions are wrong.
  nightly:
    needs: readme-nightly
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["${{ needs.readme-nightly.outputs.tag }}"]'
      label: README nightly
      opts: '["speed"]'
